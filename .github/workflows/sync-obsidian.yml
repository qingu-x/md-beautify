name: Sync to Standalone Obsidian Repo

on:
  push:
    branches:
      - vue
    paths:
      - 'apps/obsidian/src/assets/manifest.json'
      - '.github/workflows/sync-obsidian.yml'
  workflow_dispatch: # 允许手动触发，方便调试和补发版本

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: echo "version=$(node -p "require('./apps/obsidian/src/assets/manifest.json').version")" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.OBSIDIAN_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::OBSIDIAN_RELEASE_TOKEN is empty or not accessible."
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo sliiu/obsidian-md-beautify-plugin > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::warning::Release $VERSION already exists. Skipping sync, build and publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION does not exist, proceeding."
          fi

  sync-and-publish:
    needs: check-release
    if: needs.check-release.outputs.exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core
        run: pnpm --filter @mdb/core run build

      - name: Build Obsidian Plugin
        run: |
          cd apps/obsidian
          pnpm run build

      - name: Push and Create Release
        env:
          GH_TOKEN: ${{ secrets.OBSIDIAN_RELEASE_TOKEN }}
        run: |
          # 准备同步目录
          TEMP_DIR=$(mktemp -d)
          rsync -av --exclude='node_modules' --exclude='dist' apps/obsidian/ $TEMP_DIR/
          
          # 确保关键文件在根目录
          cp apps/obsidian/src/assets/manifest.json $TEMP_DIR/manifest.json
          [ -f apps/obsidian/dist/main.js ] && cp apps/obsidian/dist/main.js $TEMP_DIR/main.js
          [ -f apps/obsidian/dist/styles.css ] && cp apps/obsidian/dist/styles.css $TEMP_DIR/styles.css
          
          # 同步赞助配置文件
          mkdir -p $TEMP_DIR/.github
          [ -f .github/FUNDING.yml ] && cp .github/FUNDING.yml $TEMP_DIR/.github/FUNDING.yml
          
          if [ -f apps/obsidian/LICENSE ]; then
            cp apps/obsidian/LICENSE $TEMP_DIR/LICENSE
          else
            cp LICENSE $TEMP_DIR/LICENSE
          fi
          
          cd $TEMP_DIR
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 使用 HTTPS + Token 认证方式，确保 URL 格式正确
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/sliiu/obsidian-md-beautify-plugin.git"
          
          git add .
          git commit -m "Sync from monorepo: ${GITHUB_SHA::7}"
          git push -f origin main

          # 创建 Release
          VERSION="${{ needs.check-release.outputs.version }}"
          zip -j md-beautify-obsidian-${VERSION}.zip main.js manifest.json styles.css
          echo "Creating release for version $VERSION"
          
          # 获取 monorepo commit 信息
          COMMIT_SHA="${GITHUB_SHA::7}"
          COMMIT_MSG=$(cd $GITHUB_WORKSPACE && git log -1 --pretty=format:"%s" $GITHUB_SHA)
          RELEASE_NOTES=$(printf "Automated release from monorepo\n\n**Source commit:** [\`%s\`](%s/%s/commit/%s)\n**Commit message:** %s" \
            "$COMMIT_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$COMMIT_MSG")

          gh release create "$VERSION" \
            main.js manifest.json styles.css md-beautify-obsidian-${VERSION}.zip \
            --repo sliiu/obsidian-md-beautify-plugin \
            --title "$VERSION" \
            --notes "$RELEASE_NOTES"
