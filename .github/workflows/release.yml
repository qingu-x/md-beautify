name: desktop-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check if release already exists
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            echo "::error::Release ${{ github.ref_name }} already exists. Refusing to overwrite."
            exit 1
          fi
          echo "Release ${{ github.ref_name }} does not exist, proceeding."

  build-macos:
    needs: check-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @mdb/web run build

      - name: Install Electron deps
        run: cd apps/electron && pnpm install --frozen-lockfile

      - name: Build Electron (macOS)
        run: cd apps/electron && pnpm run build:mac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-beautify-macos
          path: apps/electron/release/*.dmg

  build-windows:
    needs: check-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @mdb/web run build

      - name: Install Electron deps
        run: cd apps/electron && pnpm install --frozen-lockfile

      - name: Build Electron (Windows)
        run: cd apps/electron && pnpm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-beautify-windows
          path: apps/electron/release/*.exe

  build-linux:
    needs: check-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --filter @mdb/web run build

      - name: Install Electron deps
        run: cd apps/electron && pnpm install --frozen-lockfile

      - name: Build Electron (Linux)
        run: cd apps/electron && pnpm run build:linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-beautify-linux
          path: apps/electron/release/*.AppImage

  build-obsidian:
    needs: check-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core Package
        run: pnpm --filter @mdb/core run build

      - name: Build Obsidian Plugin
        run: |
          cd apps/obsidian
          pnpm run build

      - name: Zip Obsidian Plugin
        run: |
          cd apps/obsidian/dist
          zip -j md-beautify-obsidian.zip main.js manifest.json styles.css

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-beautify-obsidian
          path: apps/obsidian/dist/md-beautify-obsidian.zip

  publish-release:
    needs: [check-release, build-macos, build-windows, build-linux, build-obsidian]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MD-Beautify ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: false
          files: |
            artifacts/**/*
